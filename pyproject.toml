[project]
name = "comparables-tool"
version = "0.1.0"
description = "Outil interne de comparables boursiers (betas + multiples) pour valorisation M&A."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "yfinance>=0.2.40",
    "openpyxl>=3.1",
    "plotly>=5.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "requests-cache>=1.2",
    "streamlit-authenticator>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comparables"]
